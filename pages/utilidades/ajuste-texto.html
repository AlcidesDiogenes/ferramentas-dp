<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajuste de Texto - Ferramentas DP</title>

    <link rel="stylesheet" href="../../css/style.css">

    <script>if(localStorage.getItem("menuRetraido") === "true") document.documentElement.classList.add("menu-fechado");</script>

    <script src="../../js/head-manager.js"></script>
</head>

<body class="preload">

    <div id="sidebar-placeholder"></div>

    <main class="main-content">
        <header class="main-header">
            <h1>Ajuste de Texto</h1>
            <p class="subtitle">Converte maiúsculas/minúsculas, capitaliza palavras e limpa o texto, com contador e cópia rápida</p>
        </header>

        <section class="module-card">
            <div class="form-group">
                <label for="texto-input" class="form-label">Digite ou cole o texto abaixo, depois clique nos botões</label>
                <textarea id="texto-input" class="form-control" rows="8" placeholder="Digite ou cole seu texto aqui..." style="resize: vertical; font-family: inherit; min-height: 160px;"></textarea>
            </div>

            <div style="display: flex; justify-content: flex-end; margin: -8px 0 16px;">
                <span id="contador-texto" style="font-size: 0.82rem; color: var(--cor-texto-secundario);">0 caracteres, 0 palavras</span>
            </div>

            <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px;">
                <button type="button" class="btn-action" id="btn-maiusculo">MAIÚSCULO</button>
                <button type="button" class="btn-action" id="btn-minusculo">minúsculo</button>
                <button type="button" class="btn-action" id="btn-alternado">AlTeRnAdO</button>
                <button type="button" class="btn-action" id="btn-inverter">Inverter Texto</button>
                <button type="button" class="btn-action" id="btn-primeira-letra-palavra">Primeira Letra Palavra</button>
                <button type="button" class="btn-action" id="btn-primeira-palavra-frase">Primeira Palavra da Frase</button>
                <button type="button" class="btn-action" id="btn-remover-acentos">Remover Acentos</button>
                <button type="button" class="btn-action" id="btn-remover-espacos">Remover Espaços Extras</button>
                <button type="button" class="btn-action" id="btn-selecionar-tudo">Selecionar Tudo</button>
                <button type="button" class="btn-action" id="btn-copiar" style="background-color: var(--cor-text-success, #047857);">Copiar</button>
                <button type="button" class="btn-action" id="btn-limpar" style="background-color: var(--cor-text-danger, #b91c1c);">Limpar</button>
            </div>

            <div class="form-section" style="max-width: 520px;">
                <h3>Opções de "Primeira Letra Palavra"</h3>
                <div class="form-group">
                    <label for="opt-min-letras" class="form-label">1. Ignorar palavras menores que N letra(s)</label>
                    <input type="number" id="opt-min-letras" class="form-control" value="1" min="1">
                </div>
                <div class="form-group">
                    <label for="opt-ignorar-palavras" class="form-label">2. Ignorar as palavras</label>
                    <input type="text" id="opt-ignorar-palavras" class="form-control" value="a, o, as, os, de, dos, das, do, da, e, ou, para, por, no, na, nos, nas">
                    <small style="color: var(--cor-texto-secundario);">(Separadas por vírgula)</small>
                </div>
            </div>
        </section>
    </main>

    <script src="../../js/loader.js" defer></script>
    <script type="module" src="../../js/utilidades/ajuste-texto.js" defer></script>
</body>

</html>
