<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Tempo - Ferramentas DP</title>

    <link rel="stylesheet" href="../../css/style.css">

    <style>
        /* ============================================================
           Estilos dedicados e modernos da Calculadora de Tempo
           ============================================================ */
        .calc-tempo-container {
            max-width: 960px;
            margin: 0 auto;
        }

        /* Abas estilo Segmented Control moderno */
        .tempo-tabs {
            display: flex;
            gap: 8px;
            background-color: var(--cor-card-subtle-bg, #f1f5f9);
            border: 1px solid var(--cor-borda, #e2e8f0);
            padding: 6px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .tempo-tab-btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--cor-texto-secundario, #64748b);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--fonte-principal, sans-serif);
            outline: none;
        }

        .tempo-tab-btn:hover {
            color: var(--cor-texto-principal, #1e293b);
            background-color: rgba(0, 0, 0, 0.04);
        }

        [data-theme="dark"] .tempo-tab-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .tempo-tab-btn.active {
            background-color: var(--cor-card-bg, #ffffff);
            color: var(--cor-destaque, #2563eb);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] .tempo-tab-btn.active {
            background-color: var(--cor-card-bg, #1e293b);
            color: var(--cor-destaque, #3b82f6);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        /* Grid em 2 colunas para os formulários */
        .tempo-form-grid {
            display: grid;
            grid-template-columns: 1fr 1.15fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        @media (max-width: 768px) {
            .tempo-form-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }

        .tempo-card-section {
            background: var(--cor-card-bg, #ffffff);
            border: 1px solid var(--cor-borda, #e2e8f0);
            border-radius: 12px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 16px;
        }

        .tempo-card-title {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--cor-texto-principal, #1e293b);
            margin: 0;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--cor-borda, #e2e8f0);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Input acoplado com botão Hoje */
        .tempo-input-group {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .tempo-input-group input[type="date"] {
            flex: 1 1 auto;
            min-width: 0;
            height: 44px;
            padding: 0 12px;
            border: 1px solid var(--cor-borda, #cbd5e1);
            border-radius: 8px;
            background-color: var(--cor-input-bg, #ffffff);
            color: var(--cor-texto-principal, #1e293b);
            font-size: 0.95rem;
            font-family: var(--fonte-principal, sans-serif);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .tempo-input-group input[type="date"]:focus {
            border-color: var(--cor-destaque, #2563eb);
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .tempo-btn-hoje {
            flex: 0 0 auto;
            padding: 0 16px;
            height: 44px;
            border: 1px solid var(--cor-borda, #cbd5e1);
            border-radius: 8px;
            background-color: var(--cor-card-subtle-bg, #f8fafc);
            color: var(--cor-texto-principal, #1e293b);
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--fonte-principal, sans-serif);
        }

        .tempo-btn-hoje:hover {
            border-color: var(--cor-destaque, #2563eb);
            color: var(--cor-destaque, #2563eb);
            background-color: var(--cor-tag-bg, #e0f2fe);
        }

        [data-theme="dark"] .tempo-btn-hoje {
            background-color: var(--cor-card-subtle-bg, #111827);
            border-color: var(--cor-borda, #334155);
            color: var(--cor-texto-principal, #f8fafc);
        }

        /* Seletor moderno de Operação (Cards Clicáveis) */
        .tempo-op-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 6px;
        }

        .tempo-op-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 14px 10px;
            border: 2px solid var(--cor-borda, #e2e8f0);
            border-radius: 10px;
            background-color: var(--cor-card-subtle-bg, #f8fafc);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            user-select: none;
        }

        .tempo-op-card input[type="radio"] {
            display: none;
        }

        .tempo-op-card .op-icon {
            font-size: 1.25rem;
            margin-bottom: 4px;
        }

        .tempo-op-card .op-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--cor-texto-principal, #1e293b);
        }

        .tempo-op-card .op-sub {
            font-size: 0.75rem;
            color: var(--cor-texto-secundario, #64748b);
            margin-top: 2px;
        }

        .tempo-op-card:hover {
            border-color: var(--cor-destaque, #2563eb);
        }

        .tempo-op-card.active {
            border-color: var(--cor-destaque, #2563eb);
            background-color: var(--cor-tag-bg, #e0f2fe);
        }

        .tempo-op-card.active .op-title {
            color: var(--cor-tag-texto, #0369a1);
        }

        [data-theme="dark"] .tempo-op-card {
            background-color: var(--cor-card-subtle-bg, #111827);
            border-color: var(--cor-borda, #334155);
        }

        [data-theme="dark"] .tempo-op-card.active {
            background-color: var(--cor-tag-bg, rgba(3, 105, 161, 0.35));
            border-color: var(--cor-destaque, #3b82f6);
        }

        [data-theme="dark"] .tempo-op-card.active .op-title {
            color: var(--cor-tag-texto, #38bdf8);
        }

        /* Inputs de Dias, Meses, Anos */
        .tempo-inputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        .tempo-input-box {
            display: flex;
            flex-direction: column;
        }

        .tempo-input-label {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--cor-texto-secundario, #64748b);
            margin-bottom: 6px;
        }

        .tempo-number-input {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            border: 1px solid var(--cor-borda, #cbd5e1);
            border-radius: 8px;
            background-color: var(--cor-input-bg, #ffffff);
            color: var(--cor-texto-principal, #1e293b);
            font-size: 1.05rem;
            font-weight: 600;
            font-family: var(--fonte-principal, sans-serif);
            text-align: center;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .tempo-number-input:focus {
            border-color: var(--cor-destaque, #2563eb);
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* Chips / Atalhos Rápidos */
        .tempo-chips-wrapper {
            margin-top: 4px;
        }

        .tempo-chips-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--cor-texto-secundario, #64748b);
            margin-bottom: 8px;
            display: block;
        }

        .tempo-chips-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tempo-chip {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--cor-borda, #cbd5e1);
            background-color: var(--cor-card-subtle-bg, #f8fafc);
            color: var(--cor-texto-principal, #1e293b);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: var(--fonte-principal, sans-serif);
        }

        .tempo-chip:hover {
            background-color: var(--cor-tag-bg, #e0f2fe);
            color: var(--cor-tag-texto, #0369a1);
            border-color: var(--cor-destaque, #2563eb);
            transform: translateY(-1px);
        }

        [data-theme="dark"] .tempo-chip {
            background-color: var(--cor-card-subtle-bg, #111827);
            border-color: var(--cor-card-subtle-borda, #374151);
            color: var(--cor-texto-principal, #f8fafc);
        }

        [data-theme="dark"] .tempo-chip:hover {
            background-color: var(--cor-tag-bg, rgba(3, 105, 161, 0.35));
            color: var(--cor-tag-texto, #38bdf8);
            border-color: var(--cor-destaque, #3b82f6);
        }

        /* Box Regra CLT */
        .tempo-clt-box {
            padding: 12px 14px;
            background-color: var(--cor-card-subtle-bg, #f8fafc);
            border: 1px solid var(--cor-borda, #cbd5e1);
            border-radius: 8px;
        }

        .tempo-clt-label {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            cursor: pointer;
            margin: 0;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--cor-texto-principal, #1e293b);
        }

        .tempo-clt-label input[type="checkbox"] {
            margin-top: 3px;
            accent-color: var(--cor-destaque, #2563eb);
            width: 16px;
            height: 16px;
        }

        .tempo-clt-sub {
            display: block;
            font-weight: 400;
            color: var(--cor-texto-secundario, #64748b);
            margin-top: 2px;
            font-size: 0.8rem;
            line-height: 1.35;
        }

        /* Ações (Botões) */
        .tempo-actions {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .tempo-btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 32px;
            height: 46px;
            border: none;
            border-radius: 8px;
            background-color: var(--cor-destaque, #2563eb);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
            transition: all 0.2s ease;
            font-family: var(--fonte-principal, sans-serif);
        }

        .tempo-btn-primary:hover {
            background-color: var(--cor-destaque-hover, #1d4ed8);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .tempo-btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 22px;
            height: 46px;
            border: 1px solid var(--cor-borda, #cbd5e1);
            border-radius: 8px;
            background-color: var(--cor-card-subtle-bg, #f8fafc);
            color: var(--cor-texto-principal, #1e293b);
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--fonte-principal, sans-serif);
        }

        .tempo-btn-secondary:hover {
            background-color: var(--cor-hover-item, #f1f5f9);
            border-color: var(--cor-texto-secundario, #64748b);
        }

        [data-theme="dark"] .tempo-btn-secondary {
            background-color: var(--cor-card-subtle-bg, #111827);
            border-color: var(--cor-borda, #334155);
            color: var(--cor-texto-principal, #f8fafc);
        }
    </style>

    <script>if(localStorage.getItem("menuRetraido") === "true") document.documentElement.classList.add("menu-fechado");</script>

    <script src="../../js/head-manager.js"></script>
</head>

<body class="preload">

    <div id="sidebar-placeholder"></div>

    <main class="main-content">
        <header class="main-header">
            <h1>Calculadora de Tempo</h1>
            <p class="subtitle">Adicione ou subtraia prazos (dias, meses e anos) para projetar datas ou calcule o tempo decorrido entre datas</p>
        </header>

        <section class="module-card calc-tempo-container">
            <!-- Abas de Navegação -->
            <div class="tempo-tabs" role="tablist" aria-label="Modos da Calculadora de Tempo">
                <button type="button" class="tempo-tab-btn active" id="tab-btn-projecao" role="tab" aria-selected="true" aria-controls="painel-projecao">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M12 14v4"/><path d="M10 16h4"/></svg>
                    <span>Projetar Data (Somar / Subtrair Prazos)</span>
                </button>
                <button type="button" class="tempo-tab-btn" id="tab-btn-diferenca" role="tab" aria-selected="false" aria-controls="painel-diferenca">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span>Diferença entre Datas (Tempo Decorrido)</span>
                </button>
            </div>

            <!-- Painel 1: Projetar Data (Somar / Subtrair Prazos) -->
            <div id="painel-projecao" role="tabpanel" aria-labelledby="tab-btn-projecao">
                <form id="form-projecao" class="simulator-form">
                    <div class="tempo-form-grid">
                        <!-- Coluna 1: Data de Início e Operação -->
                        <div class="tempo-card-section">
                            <div>
                                <h3 class="tempo-card-title">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                                    Data de Início
                                </h3>
                                <div style="margin-top: 10px;">
                                    <label for="proj-data-inicio" class="tempo-input-label">Data de Início</label>
                                    <div class="tempo-input-group">
                                        <input type="date" id="proj-data-inicio" class="form-control" required>
                                        <button type="button" class="tempo-btn-hoje" id="btn-hoje-proj" title="Preencher com a data de hoje">Hoje</button>
                                    </div>
                                </div>
                            </div>

                            <div>
                                <label class="tempo-input-label">Direção do Cálculo (Operação)</label>
                                <div class="tempo-op-cards" role="radiogroup" aria-label="Operação">
                                    <label class="tempo-op-card active" id="label-op-somar">
                                        <input type="radio" name="operacao" value="somar" checked>
                                        <span class="op-icon">➕</span>
                                        <span class="op-title">Somar Prazo (+)</span>
                                        <span class="op-sub">Data no futuro</span>
                                    </label>
                                    <label class="tempo-op-card" id="label-op-subtrair">
                                        <input type="radio" name="operacao" value="subtrair">
                                        <span class="op-icon">➖</span>
                                        <span class="op-title">Subtrair Prazo (-)</span>
                                        <span class="op-sub">Data no passado</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Coluna 2: Prazos e Opções -->
                        <div class="tempo-card-section">
                            <div>
                                <h3 class="tempo-card-title">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                    Tempo a Aplicar
                                </h3>
                                <div class="tempo-inputs-grid" style="margin-top: 10px;">
                                    <div class="tempo-input-box">
                                        <label for="proj-dias" class="tempo-input-label">Dias</label>
                                        <input type="number" id="proj-dias" class="tempo-number-input" min="0" max="36500" placeholder="0">
                                    </div>
                                    <div class="tempo-input-box">
                                        <label for="proj-meses" class="tempo-input-label">Meses</label>
                                        <input type="number" id="proj-meses" class="tempo-number-input" min="0" max="1200" placeholder="0">
                                    </div>
                                    <div class="tempo-input-box">
                                        <label for="proj-anos" class="tempo-input-label">Anos</label>
                                        <input type="number" id="proj-anos" class="tempo-number-input" min="0" max="100" placeholder="0">
                                    </div>
                                </div>
                            </div>

                            <div class="tempo-chips-wrapper">
                                <span class="tempo-chips-label">Atalhos frequentes de DP / CLT:</span>
                                <div class="tempo-chips-list">
                                    <button type="button" class="tempo-chip chip-btn" data-chip-dias="15" title="Atestado médico ou estabilidade">+15 dias</button>
                                    <button type="button" class="tempo-chip chip-btn" data-chip-dias="30" title="1º período de Experiência ou 30 dias">+30 dias</button>
                                    <button type="button" class="tempo-chip chip-btn" data-chip-dias="45" title="Experiência comum 45 dias">+45 dias</button>
                                    <button type="button" class="tempo-chip chip-btn" data-chip-dias="60" title="60 dias">+60 dias</button>
                                    <button type="button" class="tempo-chip chip-btn" data-chip-dias="90" title="Término máximo da Experiência CLT (90 dias)">+90 dias</button>
                                    <button type="button" class="tempo-chip chip-btn" data-chip-meses="2" title="2 meses exatos">+2 meses</button>
                                    <button type="button" class="tempo-chip chip-btn" data-chip-meses="6" title="6 meses">+6 meses</button>
                                    <button type="button" class="tempo-chip chip-btn" data-chip-anos="1" title="1 ano">+1 ano</button>
                                </div>
                            </div>

                            <div class="tempo-clt-box">
                                <label class="tempo-clt-label">
                                    <input type="checkbox" id="proj-regra-clt">
                                    <span>
                                        Contagem de vigência CLT (o 1º dia é o Dia 1 trabalhado)
                                        <small class="tempo-clt-sub">
                                            Para contratos a termo (ex: experiência): o dia de início já é considerado o primeiro dia de cumprimento (ex: 30 dias iniciados em 01/01 vencem em 30/01). Desmarque para soma civil pura (01/01 + 30 dias = 31/01).
                                        </small>
                                    </span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="tempo-actions">
                        <button type="submit" class="tempo-btn-primary">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                            Calcular Data
                        </button>
                        <button type="button" class="tempo-btn-secondary" id="btn-limpar-proj">Limpar</button>
                    </div>
                </form>

                <section id="resultado-projecao-section" style="display: none; margin-top: 30px;">
                    <div id="resultado-projecao"></div>
                </section>
            </div>

            <!-- Painel 2: Diferença entre Datas (Tempo Decorrido) -->
            <div id="painel-diferenca" role="tabpanel" aria-labelledby="tab-btn-diferenca" style="display: none;">
                <form id="form-tempo-casa" class="simulator-form">
                    <div class="tempo-form-grid" style="grid-template-columns: 1fr 1fr; max-width: 760px; margin: 0 auto 24px auto;">
                        <div class="tempo-card-section">
                            <h3 class="tempo-card-title">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                Data Inicial
                            </h3>
                            <div>
                                <label for="data-admissao" class="tempo-input-label">Data de Início</label>
                                <div class="tempo-input-group">
                                    <input type="date" id="data-admissao" class="form-control" required>
                                    <button type="button" class="tempo-btn-hoje" id="btn-hoje-inicio" title="Preencher com a data de hoje">Hoje</button>
                                </div>
                            </div>
                        </div>

                        <div class="tempo-card-section">
                            <h3 class="tempo-card-title">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                                Data de Término
                            </h3>
                            <div>
                                <label for="data-referencia" class="tempo-input-label">Data Final / Referência</label>
                                <div class="tempo-input-group">
                                    <input type="date" id="data-referencia" class="form-control" required>
                                    <button type="button" class="tempo-btn-hoje" id="btn-hoje-ref" title="Preencher com a data de hoje">Hoje</button>
                                </div>
                            </div>

                            <div style="margin-top: 10px;">
                                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.88rem; color: var(--cor-texto-principal, #1e293b);">
                                    <input type="checkbox" id="dif-incluir-ultimo-dia" style="accent-color: var(--cor-destaque, #2563eb); width: 16px; height: 16px;">
                                    <span>Contagem inclusiva (inclui o dia final)</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="tempo-actions">
                        <button type="submit" class="tempo-btn-primary">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                            Calcular Diferença
                        </button>
                        <button type="button" class="tempo-btn-secondary" id="btn-limpar-dif">Limpar</button>
                    </div>
                </form>

                <section id="resultado-section" style="display: none; margin-top: 30px;">
                    <div id="resultado-calculo"></div>
                </section>
            </div>
        </section>
    </main>

    <script src="../../js/loader.js" defer></script>
    <script type="module" src="../../js/utilidades/tempo-de-casa.js" defer></script>
</body>

</html>
