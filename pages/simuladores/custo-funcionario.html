<!DOCTYPE html>
<html lang="pt-br">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custo de Funcionário - Ferramentas DP</title>
    
    <!-- CSS Global -->
    <link rel="stylesheet" href="../../css/style.css"> 

    <!-- Trava de estado do menu para evitar flicker -->
    <script>if(localStorage.getItem("menuRetraido") === "true") document.documentElement.classList.add("menu-fechado");</script>

    <!-- Gerenciador Universal -->
    <script src="../../js/head-manager.js"></script>
</head>

<body class="preload">
    <div id="sidebar-placeholder"></div>

    <main class="main-content">
        <header class="page-header" style="margin-bottom: 25px; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px;">
            <h1>Simulador de Custo do Funcionário</h1>
            <p style="font-size: 0.95rem; color: var(--cor-texto-secundario);">Projeção detalhada de custos, encargos patronais, provisões e repasses.</p>
        </header>

        <section id="secao-custo-funcionario" class="module-card" style="padding: 25px;">
            
            <div class="custo-grid-container" style="display: grid; grid-template-columns: 1fr; gap: 30px;">
                
                <!-- BLOCO 1: Parâmetros Fiscais e de Apuração -->
                <div class="custo-form-section" style="background-color: #f8fafc; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0;">
                    <h3 style="border-bottom: 2px solid #cbd5e1; padding-bottom: 8px; margin-bottom: 15px; color: #334155;">Configurações da Empresa</h3>
                    <div class="custo-form-row">
                        <div class="custo-form-group">
                            <label>Regime Tributário</label>
                            <select id="regime-tributario" class="custo-form-control">
                                <option value="simples">Simples Nacional</option>
                                <option value="concomitante">Simples Concomitante</option>
                                <option value="lucro">Lucro Presumido/Real</option>
                                <option value="domestico">Doméstico</option>
                            </select>
                        </div>
                        <div class="custo-form-group">
                            <label>Período de Projeção</label>
                            <select id="periodo-simulacao" class="custo-form-control">
                                <option value="mensal">Mensal</option>
                                <option value="semestral">Semestral</option>
                                <option value="anual">Anual</option>
                            </select>
                        </div>
                        <div class="custo-form-group">
                            <label>% INSS Patronal</label>
                            <input type="number" id="inss-patronal" class="custo-form-control" step="0.01">
                        </div>
                        <div class="custo-form-group">
                            <label>% INSS Terceiros</label>
                            <input type="number" id="inss-terceiros" class="custo-form-control" step="0.01">
                        </div>
                        <div class="custo-form-group">
                            <label>% INSS GILRAT</label>
                            <input type="number" id="inss-gilrat" class="custo-form-control" step="0.01">
                        </div>
                    </div>
                </div>

                <!-- GRUPO DO MEIO: 2 Colunas para Jornada e Remuneração Fixa -->
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 30px;">
                    
                    <!-- BLOCO 2: Parâmetros de Jornada -->
                    <div class="custo-form-section">
                        <h3 style="border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 15px; color: #334155;">Jornada e Escala</h3>
                        <div class="custo-form-row">
                            <div class="custo-form-group">
                                <label>Categoria</label>
                                <select id="is-horista" class="custo-form-control">
                                    <option value="nao">Mensalista</option>
                                    <option value="sim">Horista</option>
                                </select>
                            </div>
                            <div class="custo-form-group">
                                <label>Horas Mensais</label>
                                <input type="number" id="horas-mensais" class="custo-form-control" value="220">
                            </div>
                            <div class="custo-form-group">
                                <label>Divisor do Mês</label>
                                <input type="number" id="divisor-mes" class="custo-form-control" value="30">
                            </div>
                            <div class="custo-form-group">
                                <label>Dias Úteis</label>
                                <input type="number" id="dias-uteis" class="custo-form-control" value="25">
                            </div>
                            <div class="custo-form-group">
                                <label>Dias Não Úteis</label>
                                <input type="number" id="dias-nao-uteis" class="custo-form-control" value="5">
                            </div>
                        </div>
                    </div>

                    <!-- BLOCO 3: Remuneração Base e Adicionais Fixos -->
                    <div class="custo-form-section">
                        <h3 style="border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 15px; color: #334155;">Remuneração Contratual</h3>
                        <div class="custo-form-row">
                            <div class="custo-form-group">
                                <label>Salário Base (R$)</label>
                                <input type="number" id="salario-base" class="custo-form-control" step="0.01">
                            </div>
                            <div class="custo-form-group">
                                <label>Dependentes (IRRF)</label>
                                <input type="number" id="dependentes-irrf" class="custo-form-control" value="0" step="1">
                            </div>
                            <div class="custo-form-group">
                                <label>Insalubridade</label>
                                <select id="insalubridade" class="custo-form-control">
                                    <option value="0">Não</option>
                                    <option value="0.10">10% (Mínimo)</option>
                                    <option value="0.20">20% (Médio)</option>
                                    <option value="0.40">40% (Máximo)</option>
                                </select>
                            </div>
                            <div class="custo-form-group">
                                <label>Base Insalubridade (R$)</label>
                                <input type="number" id="base-salario-insalubridade" class="custo-form-control" step="0.01">
                            </div>
                            <div class="custo-form-group">
                                <label>Periculosidade</label>
                                <select id="periculosidade" class="custo-form-control">
                                    <option value="nao">Não</option>
                                    <option value="sim">Sim (30%)</option>
                                </select>
                            </div>
                            <div class="custo-form-group">
                                <label>% Adicional Noturno</label>
                                <input type="number" id="perc-adicional-noturno" class="custo-form-control" value="20" step="1">
                            </div>
                            <div class="custo-form-group">
                                <label>% Hora Extra Padrão</label>
                                <input type="number" id="perc-he" class="custo-form-control" value="50" step="1">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- BLOCO 4: Variáveis do Mês (Apontamentos) -->
                <div class="custo-form-section" style="background-color: #f8fafc; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0;">
                    <h3 style="border-bottom: 2px solid #cbd5e1; padding-bottom: 8px; margin-bottom: 15px; color: #334155;">Apontamentos do Mês (Variáveis)</h3>
                    <div class="custo-form-row">
                        <div class="custo-form-group">
                            <label>Horas Extras (HH:mm)</label>
                            <input type="time" id="horas-extras-qtd" class="custo-form-control">
                        </div>
                        <div class="custo-form-group">
                            <label>Horas Noturnas (HH:mm)</label>
                            <input type="time" id="horas-noturnas-qtd" class="custo-form-control">
                        </div>
                        <div class="custo-form-group">
                            <label>Extras Noturnas (HH:mm)</label>
                            <input type="time" id="horas-extras-noturnas-qtd" class="custo-form-control">
                        </div>
                        <div class="custo-form-group">
                            <label>Outros Proventos (R$)</label>
                            <input type="number" id="outros-proventos" class="custo-form-control" step="0.01">
                        </div>
                        <div class="custo-form-group">
                            <label>Outros Descontos (R$)</label>
                            <input type="number" id="outros-descontos" class="custo-form-control" step="0.01">
                        </div>
                    </div>
                </div>

                <!-- BLOCO 5: Benefícios -->
                <div class="custo-form-section">
                    <h3 style="border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 15px; color: #334155;">Benefícios Auxiliares</h3>
                    <div class="custo-form-row">
                        <div class="custo-form-group">
                            <label>Vale-Refeição / Dia (R$)</label>
                            <input type="number" id="vr-dia" class="custo-form-control" step="0.01">
                        </div>
                        <div class="custo-form-group">
                            <label>Vale-Alimentação / Mês (R$)</label>
                            <input type="number" id="va-mes" class="custo-form-control" step="0.01">
                        </div>
                        <div class="custo-form-group">
                            <label>Vale-Transporte / Unit.</label>
                            <input type="number" id="vt-unidade" class="custo-form-control" step="0.01">
                        </div>
                        <div class="custo-form-group">
                            <label>Outros Benefícios (R$)</label>
                            <input type="number" id="outros-beneficios" class="custo-form-control" step="0.01">
                        </div>
                    </div>
                </div>

            </div> <!-- Fim Grid Principal -->

            <!-- BARRA DE AÇÕES -->
            <div style="display: flex; justify-content: flex-end; gap: 15px; margin-top: 35px; padding-top: 20px; border-top: 1px solid #e2e8f0;">
                <button type="button" id="btn-limpar" style="background-color: transparent; color: #475569; padding: 12px 25px; border: 1px solid #cbd5e1; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.2s;">
                    Limpar Dados
                </button>
                <button type="button" id="btn-gerar-pdf" style="display: none; background-color: #10b981; color: white; padding: 12px 25px; border: none; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
                    Baixar PDF
                </button>
                <button type="button" id="btn-calcular" style="background-color: #2563eb; color: white; padding: 12px 35px; border: none; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
                    Processar Cálculo
                </button>
            </div>

            <!-- CONTAINER DE RESULTADOS -->
            <div id="resultado-container" style="display: none; margin-top: 30px; padding-top: 20px;">
                <!-- O JS injetará os resultados financeiros aqui -->
            </div>

        </section>
    </main>

    <!-- Scripts do PDFMake e Lógica do Módulo -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    <script src="../../js/loader.js" defer></script>
    <script type="module" src="../../js/simuladores/custo-funcionario.js" defer></script>
</body>
</html>
