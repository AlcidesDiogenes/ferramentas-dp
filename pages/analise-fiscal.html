<!DOCTYPE html>
<html lang="pt-BR">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise Fiscal - Ferramentas DP</title>
    
    <link rel="stylesheet" href="../css/style.css"> 

    <script>if(localStorage.getItem("menuRetraido") === "true") document.documentElement.classList.add("menu-fechado");</script>

    <script src="../js/head-manager.js"></script>
</head>

<body class="preload">

    <div id="sidebar-placeholder"></div>

    <main class="main-content">
        <div class="main-header"> <h1>Análise de Situação Fiscal</h1>
            <p class="subtitle">Análise de pendências em Relatórios de Situação Fiscal</p>
        </div>

        <section class="module-card">
            <h3>Importação de Relatórios Fiscais</h3>
            <p class="subtitle">Selecione os relatórios em PDF para processamento</p>
            
            <div class="upload-zone" data-accept=".pdf" data-multiple="true" data-title="Importar Relatórios de Situação Fiscal (PDF)" data-desc="Arraste e solte os relatórios em PDF do e-CAC / Receita Federal">
                <input type="file" id="file-input-fiscal" multiple accept=".pdf" class="input-file-hidden">
                <label for="file-input-fiscal" class="btn-action">
<svg
  class="lucide lucide-folder"
  xmlns="http://www.w3.org/2000/svg" width="1.2em" height="1.2em" style="vertical-align: middle;"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />
</svg>
 Selecionar Arquivos PDF</label>
            </div>

            <div class="import-status-container" id="import-status-fiscal" style="display: none;">
                <h4>Arquivos Carregados:</h4>
                <ul id="lista-arquivos-fiscal" class="file-status-list"></ul>
            </div>
        </section>

        <div class="actions-bar" id="actions-panel-fiscal" style="display: none;">
            <div class="export-buttons">
                <button id="btn-export-excel-fiscal" class="btn-action btn-excel">
<svg
  class="lucide lucide-check-circle"
  xmlns="http://www.w3.org/2000/svg" width="1.2em" height="1.2em" style="vertical-align: middle;"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M21.801 10A10 10 0 1 1 17 3.335" />
  <path d="m9 11 3 3L22 4" />
</svg>
 Baixar em Planilha</button>
                <button id="btn-export-pdf-fiscal" class="btn-action btn-pdf">
<svg
  class="lucide lucide-circle-dot"
  xmlns="http://www.w3.org/2000/svg" width="1.2em" height="1.2em" style="vertical-align: middle;"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <circle cx="12" cy="12" r="10" />
  <circle cx="12" cy="12" r="1" />
</svg>
 Baixar em PDF</button>
                
               <button id="btn-detalhar-excel" class="btn-action" style="background-color: #eab308; color: #fff; border: none;">
<svg
  class="lucide lucide-alert-circle"
  xmlns="http://www.w3.org/2000/svg" width="1.2em" height="1.2em" style="vertical-align: middle;"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <circle cx="12" cy="12" r="10" />
  <line x1="12" x2="12" y1="8" y2="12" />
  <line x1="12" x2="12.01" y1="16" y2="16" />
</svg>
 Detalhar Planilha</button>
                <button id="btn-detalhar-pdf" class="btn-action" style="background-color: #f97316; color: #fff; border: none;">
<svg
  class="lucide lucide-alert-circle"
  xmlns="http://www.w3.org/2000/svg" width="1.2em" height="1.2em" style="vertical-align: middle;"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <circle cx="12" cy="12" r="10" />
  <line x1="12" x2="12" y1="8" y2="12" />
  <line x1="12" x2="12.01" y1="16" y2="16" />
</svg>
 Detalhar PDF</button>
            </div>
            
            <div class="filter-container">
                <input type="text" id="input-filtro-fiscal">
            </div>
        </div>

        <section class="module-card" id="report-section" style="display: none; margin-top: 20px;">
            <div id="print-area">
                <div class="report-web-header">
                    <h3>Resultado da Análise Fiscal</h3>
                </div>
                
                <div class="table-responsive">
                    <table class="data-table" id="tabela-resultados">
                        <thead>
                            <tr>
                                <th>Nome / Empresa</th>
                                <th>CPF/CNPJ</th>
                                <th>Data da Consulta</th>
                                <th>Situação</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-corpo">
                            </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script src="../js/motor-filtros.js" defer></script>
    <script src="../js/loader.js" defer></script>
    
    <script type="module" src="../js/analise-fiscal.js" defer></script>
</body>
</html>
