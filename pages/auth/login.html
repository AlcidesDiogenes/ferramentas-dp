<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferramentas DP - Autenticação</title>
    <link rel="stylesheet" href="../../css/style.css">
    <script src="../../js/toast.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body.preload {
            background-color: #0f172a !important;
            color: #f1f5f9 !important;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            padding: 20px 16px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .module-card {
            background-color: #1e293b !important;
            border: 1px solid #334155 !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4) !important;
            width: 100%;
            max-width: 420px;
            padding: 32px 24px;
            border-radius: 12px !important;
            box-sizing: border-box;
            margin: auto;
        }
        @media (max-width: 480px) {
            .login-wrapper {
                padding: 16px 12px;
            }
            .module-card {
                padding: 24px 18px !important;
            }
        }
        .module-card h2, .module-card p.subtitle { color: #f1f5f9 !important; }
        .module-card label {
            color: #e2e8f0 !important;
            font-size: 0.95rem;
            font-weight: 500;
            display: block;
            margin-bottom: 6px;
        }
        .module-card input {
            background-color: #334155 !important;
            color: #f1f5f9 !important;
            border: 1px solid #475569 !important;
            font-size: 16px !important; /* Evita zoom automático no Safari iOS */
            min-height: 44px;
            box-sizing: border-box;
        }
        .module-card input:focus { border-color: #38bdf8 !important; outline: none; }
        .module-card input::placeholder { color: #94a3b8 !important; }
        .btn-action.btn-success {
            background-color: #0284c7 !important;
            color: white !important;
            border: none !important;
            min-height: 44px;
            font-size: 1rem;
        }
        .btn-action.btn-success:hover { background-color: #0369a1 !important; }
        .auth-link {
            background: none; border: none; color: #7dd3fc !important;
            cursor: pointer; font-size: 0.9rem; text-decoration: underline;
            padding: 6px;
        }
        #msg-feedback.text-warning { color: #fbbf24 !important; }
        #msg-feedback.text-danger { color: #f87171 !important; }
        #msg-feedback.text-success { color: #4ade80 !important; }
    </style>
</head>
<body class="preload">
    <main class="login-wrapper">
        <section class="module-card">
            <h2 id="titulo-modo" style="margin-bottom: 5px;">Acesso ao Sistema</h2>
            <p class="subtitle" id="sub-modo">Entre com sua conta para utilizar o robô de CCT.</p>
            
            <form id="form-auth" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
                <div id="grupo-email">
                    <label for="input-email">E-mail:</label>
                    <input type="email" id="input-email" placeholder="seu@email.com" style="width: 100%; padding: 10px; border-radius: 6px;">
                </div>
                <div id="grupo-senha">
                    <label for="input-senha" id="label-senha">Senha:</label>
                    <div style="position: relative; width: 100%;">
                        <input type="password" id="input-senha" placeholder="••••••••" style="width: 100%; padding: 10px 42px 10px 10px; border-radius: 6px; box-sizing: border-box;">
                        <button type="button" id="btn-toggle-senha" aria-label="Mostrar ou ocultar senha" title="Mostrar/Ocultar senha" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: #94a3b8; cursor: pointer; padding: 6px; display: flex; align-items: center; justify-content: center; border-radius: 4px; transition: color 0.2s;">
                            <!-- Ícone Olho Oculto/Fechado (Padrão) -->
                            <svg id="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                            <!-- Ícone Olho Visível/Aberto -->
                            <svg id="icon-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <button type="submit" id="btn-submit" class="btn-action btn-success" style="width: 100%; padding: 12px; cursor: pointer; margin-top: 5px; border-radius: 6px; font-weight: bold;">Entrar</button>
                
                <div id="container-links" style="display: flex; flex-direction: column; gap: 8px; text-align: center; margin-top: 10px;">
                    <button type="button" id="link-recuperar" class="auth-link">Esqueceu sua senha?</button>
                    <button type="button" id="alternar-modo" class="auth-link">Não tem uma conta? Cadastre-se</button>
                </div>
                <p id="msg-feedback" style="text-align: center; font-size: 0.9rem; margin-top: 5px; min-height: 1.2rem; word-break: break-word;"></p>
            </form>

            <!-- Status do Supabase & Painel de Configurações Seletivo -->
            <div style="margin-top: 20px; border-top: 1px solid #334155; padding-top: 16px;">
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <div id="supabase-status-badge" style="font-size: 0.82rem; color: #94a3b8; display: flex; align-items: center; gap: 6px;">
                        <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: #eab308;"></span>
                        <span>Verificando Supabase...</span>
                    </div>
                    <button type="button" id="btn-toggle-config-supabase" style="background: none; border: none; color: #38bdf8; cursor: pointer; font-size: 0.82rem; text-decoration: underline; padding: 2px 4px;">
                        ⚙️ Configurar Supabase
                    </button>
                </div>

                <div id="painel-config-supabase" style="display: none; margin-top: 14px; background: #0f172a; padding: 14px; border-radius: 8px; border: 1px solid #334155;">
                    <h4 style="margin: 0 0 10px 0; color: #f1f5f9; font-size: 0.9rem;">Parâmetros de Conexão Supabase</h4>
                    <p style="color: #94a3b8; font-size: 0.8rem; margin-top: 0; margin-bottom: 12px;">Seu projeto Supabase precisa de uma URL válida e uma Chave Anon. Se informadas abaixo, serão salvas no navegador.</p>
                    
                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <div>
                            <label for="cfg-supabase-url" style="font-size: 0.8rem; color: #cbd5e1; display: block; margin-bottom: 4px;">URL do Supabase:</label>
                            <input type="text" id="cfg-supabase-url" placeholder="https://seu-projeto.supabase.co" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #475569; background: #1e293b; color: #f1f5f9; font-size: 0.85rem; box-sizing: border-box;">
                        </div>
                        <div>
                            <label for="cfg-supabase-key" style="font-size: 0.8rem; color: #cbd5e1; display: block; margin-bottom: 4px;">Chave Anon (Public Key):</label>
                            <input type="password" id="cfg-supabase-key" placeholder="eyJhbGciOi..." style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #475569; background: #1e293b; color: #f1f5f9; font-size: 0.85rem; box-sizing: border-box;">
                        </div>
                        <div style="display: flex; gap: 8px; margin-top: 6px;">
                            <button type="button" id="btn-testar-supabase" style="flex: 1; padding: 8px; background: #334155; color: #f1f5f9; border: 1px solid #475569; border-radius: 4px; font-size: 0.8rem; cursor: pointer; font-weight: 500;">
                                🔍 Testar Conexão
                            </button>
                            <button type="button" id="btn-salvar-supabase" style="flex: 1; padding: 8px; background: #0284c7; color: white; border: none; border-radius: 4px; font-size: 0.8rem; cursor: pointer; font-weight: bold;">
                                💾 Salvar e Aplicar
                            </button>
                        </div>
                        <p id="msg-cfg-feedback" style="font-size: 0.8rem; margin: 4px 0 0 0; min-height: 1rem; text-align: center; word-break: break-word;"></p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script type="module">
        import { supabase, realizarLogin, realizarCadastro, recuperarSenha, atualizarSenha, getSupabaseConfig, saveSupabaseConfig, testSupabaseConnection } from '../../js/services/auth.js';

        let estadoAtual = 'login';
        
        const tituloModo = document.getElementById("titulo-modo");
        const subModo = document.getElementById("sub-modo");
        const btnSubmit = document.getElementById("btn-submit");
        const grupoEmail = document.getElementById("grupo-email");
        const inputEmail = document.getElementById("input-email");
        const grupoSenha = document.getElementById("grupo-senha");
        const inputSenha = document.getElementById("input-senha");
        const btnToggleSenha = document.getElementById("btn-toggle-senha");
        const iconEye = document.getElementById("icon-eye");
        const iconEyeOff = document.getElementById("icon-eye-off");
        const labelSenha = document.getElementById("label-senha");
        const containerLinks = document.getElementById("container-links");
        const linkAlternar = document.getElementById("alternar-modo");
        const linkRecuperar = document.getElementById("link-recuperar");
        const msgFeedback = document.getElementById("msg-feedback");

        // Elementos de Configuração do Supabase
        const btnToggleConfig = document.getElementById("btn-toggle-config-supabase");
        const painelConfig = document.getElementById("painel-config-supabase");
        const cfgUrlInput = document.getElementById("cfg-supabase-url");
        const cfgKeyInput = document.getElementById("cfg-supabase-key");
        const btnTestar = document.getElementById("btn-testar-supabase");
        const btnSalvar = document.getElementById("btn-salvar-supabase");
        const msgCfgFeedback = document.getElementById("msg-cfg-feedback");
        const badgeStatus = document.getElementById("supabase-status-badge");

        // Funcionalidade de Mostrar / Ocultar Senha
        if (btnToggleSenha && inputSenha) {
            btnToggleSenha.addEventListener("click", () => {
                const modoTexto = inputSenha.type === "password";
                inputSenha.type = modoTexto ? "text" : "password";
                if (iconEye && iconEyeOff) {
                    iconEye.style.display = modoTexto ? "block" : "none";
                    iconEyeOff.style.display = modoTexto ? "none" : "block";
                }
                btnToggleSenha.title = modoTexto ? "Ocultar senha" : "Mostrar senha";
                btnToggleSenha.setAttribute("aria-label", modoTexto ? "Ocultar senha" : "Mostrar senha");
            });
        }

        // Tradutor de Erros Técnicos para Mensagens Profissionais
        function traduzirErro(error) {
            const mensagem = (error && error.message) ? error.message.toLowerCase() : String(error).toLowerCase();
            
            if (mensagem.includes("config_required")) {
                return error.message.replace('CONFIG_REQUIRED: ', '');
            }
            if (mensagem.includes("invalid login credentials")) {
                return "E-mail ou senha incorretos. Por favor, verifique seus dados e tente novamente.";
            }
            if (mensagem.includes("email not confirmed")) {
                return "Este e-mail ainda não foi confirmado no Supabase. Verifique sua caixa de entrada e spam.";
            }
            if (mensagem.includes("user not found")) {
                return "Usuário não encontrado. Se ainda não possui conta, altere para 'Cadastre-se'.";
            }
            if (mensagem.includes("user already registered")) {
                return "Este e-mail já está cadastrado no sistema. Faça login ou recupere sua senha.";
            }
            if (mensagem.includes("password should be at least")) {
                return "A senha deve ter pelo menos 6 caracteres.";
            }
            if (mensagem.includes("email rate limit exceeded")) {
                return "Muitas solicitações enviadas recentemente. Por favor, aguarde alguns minutos antes de tentar novamente.";
            }
            if (mensagem.includes("failed to fetch") || mensagem.includes("network error") || mensagem.includes("fetch failed") || mensagem.includes("xyzcompany")) {
                return "Falha ao conectar com o Supabase. Clique em '⚙️ Configurar Supabase' abaixo e verifique a URL e Chave Anon do projeto.";
            }
            if (mensagem.includes("invalid api key") || mensagem.includes("apikey") || mensagem.includes("jwt")) {
                return "Chave Anon do Supabase inválida. Atualize as credenciais no painel de configurações.";
            }
            
            // Retorno detalhado caso seja outro erro técnico
            return error.message || "Ocorreu um erro ao processar sua solicitação. Tente novamente.";
        }

        // Validador de Limite de Tentativas de Recuperação (Máx 2 vezes por minuto)
        function verificarRateLimitRecuperacao() {
            const agora = Date.now();
            const LIMITE_TEMPO = 60 * 1000;
            const MAX_TENTATIVAS = 2;

            let historico = JSON.parse(localStorage.getItem('tentativas_recuperacao') || '[]');
            historico = historico.filter(timestamp => (agora - timestamp) < LIMITE_TEMPO);

            if (historico.length >= MAX_TENTATIVAS) {
                return false;
            }

            historico.push(agora);
            localStorage.setItem('tentativas_recuperacao', JSON.stringify(historico));
            return true;
        }

        // Atualização e Teste de Status do Supabase na Tela
        async function atualizarStatusSupabase() {
            const cfg = getSupabaseConfig();
            cfgUrlInput.value = cfg.url;
            cfgKeyInput.value = cfg.key;

            if (cfg.isDefault) {
                badgeStatus.innerHTML = `
                    <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: #ef4444;"></span>
                    <span style="color: #f87171;">Supabase não configurado (URL padrão)</span>
                `;
                return;
            }

            badgeStatus.innerHTML = `
                <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: #eab308;"></span>
                <span>Testando conexão com Supabase...</span>
            `;

            const teste = await testSupabaseConnection(cfg.url, cfg.key);
            if (teste.success) {
                badgeStatus.innerHTML = `
                    <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: #22c55e;"></span>
                    <span style="color: #4ade80;">Supabase Ativo & Saudável</span>
                `;
            } else {
                badgeStatus.innerHTML = `
                    <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: #ef4444;"></span>
                    <span style="color: #f87171;" title="${teste.error}">Erro de conexão com Supabase</span>
                `;
            }
        }

        // Alternar visualização do painel de configuração
        btnToggleConfig.addEventListener("click", () => {
            const visivel = painelConfig.style.display === "block";
            painelConfig.style.display = visivel ? "none" : "block";
        });

        // Testar Conexão Manualmente
        btnTestar.addEventListener("click", async () => {
            msgCfgFeedback.textContent = "Testando conexão com servidor Supabase...";
            msgCfgFeedback.style.color = "#fbbf24";
            
            const res = await testSupabaseConnection(cfgUrlInput.value, cfgKeyInput.value);
            if (res.success) {
                msgCfgFeedback.textContent = "✅ Conexão estabelecida com sucesso! O servidor Supabase está ativo e respondendo.";
                msgCfgFeedback.style.color = "#4ade80";
            } else {
                msgCfgFeedback.textContent = `❌ ${res.error}`;
                msgCfgFeedback.style.color = "#f87171";
            }
        });

        // Salvar Credenciais do Supabase
        btnSalvar.addEventListener("click", async () => {
            const u = cfgUrlInput.value.trim();
            const k = cfgKeyInput.value.trim();

            if (!u || !k) {
                msgCfgFeedback.textContent = "Preencha a URL e a Chave Anon antes de salvar.";
                msgCfgFeedback.style.color = "#f87171";
                return;
            }

            saveSupabaseConfig(u, k);
            msgCfgFeedback.textContent = "✅ Configuração salva com sucesso!";
            msgCfgFeedback.style.color = "#4ade80";

            await atualizarStatusSupabase();
            setTimeout(() => {
                painelConfig.style.display = "none";
                msgCfgFeedback.textContent = "";
            }, 1200);
        });

        supabase.auth.onAuthStateChange(async (event) => {
            if (event === 'PASSWORD_RECOVERY') {
                estadoAtual = 'atualizar_senha';
                atualizarInterface();
            }
        });

        function atualizarInterface() {
            msgFeedback.textContent = "";
            if (inputSenha) {
                inputSenha.type = "password";
                if (iconEye && iconEyeOff) {
                    iconEye.style.display = "none";
                    iconEyeOff.style.display = "block";
                }
            }
            if (estadoAtual === 'login') {
                tituloModo.textContent = "Acesso ao Sistema";
                subModo.textContent = "Entre com sua conta para utilizar o robô de CCT.";
                btnSubmit.textContent = "Entrar";
                grupoEmail.style.display = "block";
                inputEmail.required = true;
                grupoSenha.style.display = "block";
                inputSenha.required = true;
                labelSenha.textContent = "Senha:";
                inputSenha.placeholder = "••••••••";
                containerLinks.style.display = "flex";
                linkRecuperar.style.display = "inline-block";
                linkAlternar.textContent = "Não tem uma conta? Cadastre-se";
            } else if (estadoAtual === 'cadastro') {
                tituloModo.textContent = "Criar Nova Conta";
                subModo.textContent = "Cadastre-se para acessar o robô.";
                btnSubmit.textContent = "Cadastrar";
                grupoEmail.style.display = "block";
                inputEmail.required = true;
                grupoSenha.style.display = "block";
                inputSenha.required = true;
                labelSenha.textContent = "Senha:";
                inputSenha.placeholder = "••••••••";
                containerLinks.style.display = "flex";
                linkRecuperar.style.display = "none";
                linkAlternar.textContent = "Já tem uma conta? Faça login";
            } else if (estadoAtual === 'recuperacao') {
                tituloModo.textContent = "Recuperar Senha";
                subModo.textContent = "Informe seu e-mail para receber o link de redefinição.";
                btnSubmit.textContent = "Enviar E-mail de Recuperação";
                grupoEmail.style.display = "block";
                inputEmail.required = true;
                grupoSenha.style.display = "none";
                inputSenha.required = false;
                containerLinks.style.display = "flex";
                linkRecuperar.style.display = "none";
                linkAlternar.textContent = "Lembrou a senha? Faça login";
            } else if (estadoAtual === 'atualizar_senha') {
                tituloModo.textContent = "Definir Nova Senha";
                subModo.textContent = "Digite sua nova senha de acesso abaixo.";
                btnSubmit.textContent = "Salvar Nova Senha";
                grupoEmail.style.display = "none";
                inputEmail.required = false;
                grupoSenha.style.display = "block";
                inputSenha.required = true;
                labelSenha.textContent = "Nova Senha:";
                inputSenha.placeholder = "Nova senha segura";
                containerLinks.style.display = "none";
            }
        }

        linkAlternar.addEventListener("click", () => {
            estadoAtual = (estadoAtual === 'login') ? 'cadastro' : 'login';
            atualizarInterface();
        });

        linkRecuperar.addEventListener("click", () => {
            estadoAtual = 'recuperacao';
            atualizarInterface();
        });

        document.getElementById("form-auth").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = inputEmail.value.trim();
            const senha = inputSenha.value.trim();
            msgFeedback.textContent = "Processando...";
            msgFeedback.className = "text-warning";

            try {
                if (estadoAtual === 'cadastro') {
                    const resposta = await realizarCadastro(email, senha);
                    if (resposta.session) {
                        msgFeedback.textContent = "Conta criada com sucesso! Entrando...";
                        msgFeedback.className = "text-success";
                        if (window.toast) window.toast.success("Conta criada com sucesso! Entrando...");
                        setTimeout(() => window.location.href = "../../index.html", 800);
                    } else {
                        msgFeedback.textContent = "Cadastro realizado! Se necessário, verifique a caixa de e-mail.";
                        msgFeedback.className = "text-success";
                        if (window.toast) window.toast.success("Cadastro realizado com sucesso!");
                    }
                } else if (estadoAtual === 'login') {
                    await realizarLogin(email, senha);
                    msgFeedback.textContent = "Login bem-sucedido! Redirecionando...";
                    msgFeedback.className = "text-success";
                    if (window.toast) window.toast.success("Login bem-sucedido! Redirecionando...");
                    setTimeout(() => window.location.href = "../../index.html", 800);
                } else if (estadoAtual === 'recuperacao') {
                    if (!verificarRateLimitRecuperacao()) {
                        const msg = "Muitas solicitações. Você pode solicitar a recuperação de senha no máximo 2 vezes por minuto.";
                        msgFeedback.textContent = msg;
                        msgFeedback.className = "text-danger";
                        if (window.toast) window.toast.warning(msg);
                        return;
                    }

                    await recuperarSenha(email);
                    msgFeedback.textContent = "E-mail de recuperação enviado! Verifique sua caixa de entrada.";
                    msgFeedback.className = "text-success";
                    if (window.toast) window.toast.success("E-mail de recuperação enviado! Verifique sua caixa de entrada.");
                } else if (estadoAtual === 'atualizar_senha') {
                    await atualizarSenha(senha);
                    msgFeedback.textContent = "Senha alterada com sucesso! Redirecionando...";
                    msgFeedback.className = "text-success";
                    if (window.toast) window.toast.success("Senha alterada com sucesso!");
                    setTimeout(() => window.location.href = "../../index.html", 1000);
                }
            } catch (error) {
                const msgErro = traduzirErro(error);
                msgFeedback.textContent = msgErro;
                msgFeedback.className = "text-danger";
                if (window.toast) window.toast.error(msgErro);
            }
        });

        atualizarInterface();
        atualizarStatusSupabase();
    </script>
</body>
</html>
