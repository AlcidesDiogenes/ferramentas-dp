<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferramentas DP - Central do Usuário</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/atualizar-dados.css">
    <script src="../../js/head-manager.js"></script>
    <script type="module" src="../../js/services/auth-guard.js"></script>
</head>
<body class="preload">
    <main class="main-content perfil-main">
        <section class="perfil-card">
            <button type="button" id="btn-voltar" class="btn-voltar">← Voltar ao Painel</button>
            <h2>Central do Usuário</h2>
            <p class="subtitle">Gerencie suas informações, histórico e pagamentos.</p>
            
            <!-- Barra de Abas (Navegação Interna) -->
            <div class="profile-tabs">
                <button type="button" class="tab-btn active" data-target="secao-cadastrais">Dados Cadastrais</button>
                <button type="button" class="tab-btn" data-target="secao-historico">Histórico</button>
                <button type="button" class="tab-btn" data-target="secao-pagamento">Pagamento</button>
            </div>

            <!-- SEÇÃO 1: DADOS CADASTRAIS -->
            <div id="secao-cadastrais" class="form-section active-section">
                <form id="form-perfil" class="perfil-form">
                    <div class="form-group">
                        <label>E-mail de Acesso:</label>
                        <input type="email" id="input-email-readonly" disabled class="input-disabled">
                    </div>
                    <div class="form-group">
                        <label for="input-nome">Nome que deseja usar:</label>
                        <input type="text" id="input-nome" placeholder="Seu nome">
                    </div>
                    <div class="form-group">
                        <label for="input-whatsapp">WhatsApp:</label>
                        <input type="text" id="input-whatsapp" placeholder="(00) 00000-0000">
                    </div>
                    <div class="form-group">
                        <label for="input-cargo">Cargo:</label>
                        <input type="text" id="input-cargo" placeholder="Ex: Analista de DP">
                    </div>
                    
                    <button type="submit" id="btn-salvar" class="btn-action btn-success">Salvar Alterações</button>
                    <p id="msg-feedback" class="msg-feedback"></p>
                </form>
            </div>

            <!-- SEÇÃO 3: HISTÓRICO -->
            <div id="secao-historico" class="form-section">
                <h3 class="section-title mb-15">Histórico de Atividades</h3>
                <div class="historico-list">
                    <p>• Último login realizado com sucesso.</p>
                    <p>• Atualização de dados cadastrais efetuada.</p>
                </div>
            </div>

            <!-- SEÇÃO 4: PAGAMENTO -->
            <div id="secao-pagamento" class="form-section">
                <h3 class="section-title mb-15">Plano e Assinatura</h3>
                <div class="pagamento-card">
                    <div class="pagamento-row">
                        <span class="pagamento-label">Status da Conta:</span>
                        <strong class="pagamento-status">Ativa (Pro)</strong>
                    </div>
                    <div class="pagamento-row">
                        <span class="pagamento-label">Renovação Automática:</span>
                        <span class="pagamento-val">Ativa</span>
                    </div>
                    <button type="button" class="btn-action btn-gerenciar">Gerenciar Assinatura</button>
                </div>
            </div>

        </section>
    </main>

    <script type="module" src="../../js/controllers/atualizar-dados.js"></script>
</body>
</html>
