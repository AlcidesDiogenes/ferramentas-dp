<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importação TXT - Ferramentas DP</title>
    
    <link rel="stylesheet" href="../../css/style.css"> 

    <script>if(localStorage.getItem("menuRetraido") === "true") document.documentElement.classList.add("menu-fechado");</script>

    <script src="../../js/head-manager.js"></script>
</head>

<body class="preload">

    <div id="sidebar-placeholder"></div>

    <main class="main-content">
        <header class="main-header">
            <h1>Importação de Lançamentos TXT</h1>
            <p class="subtitle">Converta sua planilha para o leiaute de importação da Domínio Sistemas</p>
        </header>

        <section class="module-card">
            <h3>Seleção de Planilha</h3>
            <p class="subtitle">Selecione o arquivo Excel para conversão</p>

            <div style="margin-bottom: 10px;">
                <a href="../../assets/modelos_importacao/modelo_importacao_txt.xls" download class="btn-action btn-secondary">
<svg
  class="lucide lucide-download"
  xmlns="http://www.w3.org/2000/svg" width="1.2em" height="1.2em" style="vertical-align: middle;"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M12 15V3" />
  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
  <path d="m7 10 5 5 5-5" />
</svg>
 Baixar Modelo de Planilha</a>
            </div>
            
            <div class="upload-zone" data-accept=".csv,.xls,.xlsx" data-title="Importar Planilha de Lançamentos Domínio" data-desc="Arraste e solte a planilha Excel ou CSV para conversão no layout Domínio">
                <input type="file" id="csv-input" accept=".csv, .xls, .xlsx" class="input-file-hidden">
                <label for="csv-input" class="btn-action">
<svg
  class="lucide lucide-folder"
  xmlns="http://www.w3.org/2000/svg" width="1.2em" height="1.2em" style="vertical-align: middle;"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />
</svg>
 Selecionar Planilha</label>
            </div>

            <div class="import-status-container" id="import-status-txt" style="display: none; margin-top: 15px;">
                <h4>Arquivo Carregado:</h4>
                <ul id="lista-arquivos-txt" class="file-status-list"></ul>
            </div>
        </section>

        <div id="info-header" style="display: none; margin-bottom: 20px; padding: 15px; background: var(--cor-card-bg); border-radius: var(--borda-raio); border: 1px solid var(--cor-borda);">
            <p><strong>Empresa:</strong> <span id="display-empresa"></span></p>
            <p><strong>Competência:</strong> <span id="display-competencia"></span></p>
        </div>

        <div class="actions-bar" id="actions-panel" style="display: none; justify-content: space-between; align-items: center; flex-wrap: wrap;">
            <button id="btn-processar-txt" class="btn-action btn-primary">Gerar Arquivo TXT</button>
            
            <div class="filter-container" style="min-width: 300px;">
                <input type="text" id="input-filtro" placeholder="Filtrar por nome ou código...">
            </div>
        </div>

        <section class="module-card" id="report-section" style="display: none;">
            <div class="table-responsive">
                <table class="data-table" id="tabela-resultados">
                    <thead>
                        <tr>
                            <th>Cálculo</th>
                            <th>Folha</th>
                            <th>Colaborador</th>
                            <th>Rubrica</th>
                            <th>Valor</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="../../js/motor-filtros.js" defer></script>
    <script src="../../js/loader.js" defer></script>
    <script src="../../js/dominioSistema/importacao-txt.js" defer></script>
</body>
</html>
