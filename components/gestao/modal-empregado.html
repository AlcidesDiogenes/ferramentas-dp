<!-- MODAL DE CADASTRO / EDIÇÃO DE EMPREGADOS -->
<div id="modal-cadastro-empregado" class="modal-overlay" style="display: none;">
    <div class="modal-content modal-empregado-lg">
        
        <!-- Header do Modal -->
        <div class="modal-header">
            <h3>Cadastrar Novo Colaborador</h3>
            <button type="button" id="btn-fechar-modal-empregado" class="btn-close">&times;</button>
        </div>

        <!-- Corpo do Formulário (Rolável) -->
        <div class="modal-body">
            <form id="form-empregado">
                
                <!-- SEÇÃO 1: Dados Contratuais e Obrigatórios -->
                <fieldset class="empregado-fieldset">
                    <legend class="empregado-legend">1. Dados Contratuais e Principais</legend>
                    <div class="empregado-grid">
                        
                        <div class="input-group">
                            <label>Cód Empregado *</label>
                            <input type="text" id="emp_codigo" class="form-input" required>
                        </div>

                        <div class="input-group">
                            <label>Nome Completo *</label>
                            <input type="text" id="emp_nome" class="form-input" required>
                        </div>

                        <div class="input-group">
                            <label>CPF *</label>
                            <input type="text" id="emp_cpf" class="form-input" placeholder="000.000.000-00" required>
                        </div>

                        <div class="input-group">
                            <label>Data de Admissão *</label>
                            <input type="date" id="emp_admissao" class="form-input" required>
                        </div>

                        <div class="input-group">
                            <label>Salário (R$) *</label>
                            <input type="number" step="0.01" id="emp_salario" class="form-input" placeholder="0.00" required>
                        </div>

                        <div class="input-group">
                            <label>Data de Nascimento *</label>
                            <input type="date" id="emp_nascimento" class="form-input" required>
                        </div>

                        <div class="input-group">
                            <label>Sexo *</label>
                            <select id="emp_sexo" class="form-input" required>
                                <option value="" disabled selected>Selecione...</option>
                                <option value="M">Masculino</option>
                                <option value="F">Feminino</option>
                                <option value="Outro">Outro</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label>Cód eSocial</label>
                            <input type="text" id="emp_esocial" class="form-input">
                        </div>

                        <div class="input-group">
                            <label>Categoria</label>
                            <input type="text" id="emp_categoria" class="form-input">
                        </div>

                    </div>
                </fieldset>

                <!-- SEÇÃO 2: Cargos, Funções e Departamento -->
                <fieldset class="empregado-fieldset">
                    <legend class="empregado-legend">2. Organização, Cargo e Salário</legend>
                    <div class="empregado-grid">
                        
                        <div class="input-group">
                            <label>Cód Cargo</label>
                            <input type="text" id="emp_cod_cargo" class="form-input">
                        </div>
                        <div class="input-group">
                            <label>Descrição Cargo</label>
                            <input type="text" id="emp_desc_cargo" class="form-input">
                        </div>
                        <div class="input-group">
                            <label>CBO</label>
                            <input type="text" id="emp_cbo" class="form-input">
                        </div>
                        <div class="input-group">
                            <label>Centro de Custo</label>
                            <input type="text" id="emp_ccusto" class="form-input">
                        </div>
                        <div class="input-group">
                            <label>Departamento</label>
                            <input type="text" id="emp_dpto" class="form-input">
                        </div>

                    </div>
                </fieldset>

                <!-- SEÇÃO 3: Documentação e Filiação -->
                <fieldset class="empregado-fieldset">
                    <legend class="empregado-legend">3. Documentação e Dados Pessoais</legend>
                    <div class="empregado-grid">
                        
                        <div class="input-group">
                            <label>RG</label>
                            <input type="text" id="emp_rg" class="form-input">
                        </div>
                        <div class="input-group">
                            <label>Órgão / UF RG</label>
                            <input type="text" id="emp_orgao_rg" class="form-input">
                        </div>
                        <div class="input-group">
                            <label>PIS</label>
                            <input type="text" id="emp_pis" class="form-input">
                        </div>
                        <div class="input-group">
                            <label>CTPS / Série</label>
                            <input type="text" id="emp_ctps" class="form-input">
                        </div>
                        <div class="input-group">
                            <label>Nome da Mãe</label>
                            <input type="text" id="emp_mae" class="form-input">
                        </div>
                        <div class="input-group">
                            <label>Nome do Pai</label>
                            <input type="text" id="emp_pai" class="form-input">
                        </div>

                    </div>
                </fieldset>

                <!-- SEÇÃO 4: Endereço e Contato -->
                <fieldset class="empregado-fieldset">
                    <legend class="empregado-legend">4. Endereço e Contato</legend>
                    <div class="empregado-grid">
                        
                        <div class="input-group">
                            <label>CEP</label>
                            <input type="text" id="emp_cep" class="form-input">
                        </div>
                        <div class="input-group span-col-2">
                            <label>Endereço</label>
                            <input type="text" id="emp_endereco" class="form-input">
                        </div>
                        <div class="input-group">
                            <label>Número / Bairro</label>
                            <input type="text" id="emp_bairro" class="form-input">
                        </div>
                        <div class="input-group">
                            <label>Celular / Contato</label>
                            <input type="text" id="emp_celular" class="form-input">
                        </div>
                        <div class="input-group">
                            <label>E-mail</label>
                            <input type="email" id="emp_email" class="form-input">
                        </div>

                    </div>
                </fieldset>

            </form>
        </div>

        <!-- Footer com Ações -->
        <div class="modal-footer">
            <button type="button" id="btn-cancelar-empregado" class="btn btn-secondary">Cancelar</button>
            <button type="button" id="btn-salvar-empregado" class="btn btn-primary">Salvar Colaborador</button>
        </div>

    </div>
</div>
