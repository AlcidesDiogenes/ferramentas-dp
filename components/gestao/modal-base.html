<!-- components/gestao/modal-base.html -->
<div id="modal-cadastro-base" class="modal-overlay">
    <div class="modal-content">

        <div class="modal-header">
            <h3>Cadastrar Nova Base</h3>
            <button type="button" class="btn-close" id="btn-fechar-modal-base">
                <i class="ph ph-x"></i>
            </button>
        </div>

        <div class="modal-body">
            <form id="form-base">
                <fieldset class="form-section">
                    <legend class="form-section-title">Dados da Base</legend>
                    <div class="form-row">
                        <div class="input-group" style="width: 100%;">
                            <label for="base_nome">Nome da Base *</label>
                            <input type="text" id="base_nome" class="form-input" placeholder="Ex: Matriz, Filial Norte, Sede..." required>
                        </div>
                    </div>
                </fieldset>
            </form>
        </div>

        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="btn-cancelar-base">Cancelar</button>
            <button type="button" class="btn btn-primary" id="btn-salvar-base">Salvar Base</button>
        </div>

    </div>
</div>
