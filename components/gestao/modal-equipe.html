<!-- components/gestao/modal-equipe.html -->
<div id="modal-cadastro-equipe" class="modal-overlay">
    <div class="modal-content">
        
        <div class="modal-header">
            <h3>Cadastrar Nova Equipe / Escritório</h3>
            <button type="button" class="btn-close" id="btn-fechar-modal-equipe">
                <i class="ph ph-x"></i>
            </button>
        </div>
        
        <div class="modal-body">
            <form id="form-equipe">
                <fieldset class="form-section">
                    <legend class="form-section-title">Dados da Equipe</legend>
                    <div class="form-row">
                        <div class="input-group">
                            <label for="equipe_nome">Nome da Equipe / Escritório *</label>
                            <input type="text" id="equipe_nome" class="form-input" required placeholder="Ex: Escritório Contábil Central">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="input-group">
                            <label for="equipe_descricao">Descrição / Observação</label>
                            <textarea id="equipe_descricao" class="form-input" rows="3" placeholder="Detalhes adicionais sobre a equipe..."></textarea>
                        </div>
                    </div>
                </fieldset>
            </form>
        </div>
        
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="btn-cancelar-equipe">Cancelar</button>
            <button type="button" class="btn btn-primary" id="btn-salvar-equipe">Salvar Equipe</button>
        </div>
        
    </div>
</div>
