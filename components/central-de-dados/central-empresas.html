<!-- components/central-de-dados/central-empresas.html -->
<div class="fade-in-animation">
    <div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h1 class="page-title">Central de Empresas</h1>
            <p class="page-subtitle">Gestão do Fichário de Clientes e Filiais.</p>
        </div>
        <div class="search-box">
            <input type="text" id="input-busca-empresa" class="form-input" placeholder="Buscar por Apelido ou CNPJ...">
        </div>
    </div>

    <div class="card table-card" style="margin-top: 20px;">
        <div class="table-container">
            <table class="data-table" style="width: 100%; text-align: left;">
                <thead>
                    <tr>
                        <th>Cód.</th>
                        <th>Apelido</th>
                        <th>CNPJ / CPF</th>
                        <th>Regime Tributário</th>
                        <th>Base Operacional</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <!-- ID corrigido para alinhar com central-empresas-controller.js -->
                <tbody id="tbody-central-empresas">
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 20px; color: #64748b;">Nenhuma empresa cadastrada. Utilize o menu "Novo Cadastro" para iniciar.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
